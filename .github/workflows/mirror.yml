name: Mirror GHCR -> Docker Hub (yyb-go)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  SRC: ghcr.io/525815266/yyb-go-enhanced
  DST: zhpphz/yyb-go

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Probe available tags (debug)
        run: |
          # 列出源仓库真实存在的 tag，避免用错的 digest
          curl -s "https://api.github.com/users/525815266/packages/container/yyb-go-enhanced/versions?per_page=20" \
            | jq -r 'if type=="array" then .[]?.name else .name end' || true
        continue-on-error: true

      - name: Pull from GHCR
        run: |
          # 直接拉取 :latest，绕开不稳定的 digest 字段
          docker pull ${{ env.SRC }}:latest

      - name: Tag & Push to Docker Hub
        run: |
          docker tag ${{ env.SRC }}:latest ${{ env.DST }}:latest
          docker push ${{ env.DST }}:latest

      - name: Also push version tag (optional)
        continue-on-error: true
        run: |
          # 如果 :latest 拉取成功，再尝试打一个带日期的版本号，便于回滚
          TAG=$(date +'%Y%m%d-%H%M')
          docker tag ${{ env.SRC }}:latest ${{ env.DST }}:$TAG
          docker push ${{ env.DST }}:$TAG
